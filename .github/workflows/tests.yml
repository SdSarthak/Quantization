name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheels only: the suite never touches a GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers fastapi 'uvicorn[standard]' pydantic psutil
          pip install pytest httpx

      - name: Byte-compile
        run: python -m compileall -q airavata_quant tests

      - name: Run tests
        run: python -m pytest
