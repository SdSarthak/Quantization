[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airavata-quant"
version = "0.2.0"
description = "Quantized inference and benchmarking service for the AI4Bharat Airavata model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sarthak Doshi" }]
keywords = ["quantization", "llm", "airavata", "bitsandbytes", "fastapi", "inference"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.37.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
gpu = ["accelerate>=0.24.0", "bitsandbytes>=0.41.0"]
monitoring = ["GPUtil>=1.4.0"]
dev = ["pytest>=7.4.0", "httpx>=0.24.0"]

[project.scripts]
airavata-quant = "airavata_quant.cli:main"

[project.urls]
Homepage = "https://github.com/SdSarthak/Quantization"
Issues = "https://github.com/SdSarthak/Quantization/issues"

[tool.setuptools]
packages = ["airavata_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
